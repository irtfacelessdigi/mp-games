<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MP Games – Game Coding Anak</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:linear-gradient(180deg,#ffe9a8,#ffd6ec 55%,#cfe9ff);--bg:#fff7e6;--fg:#2b2350;--card:#fff;--ac:#7c4dff;--bd:#ffd9a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1736;--fg:#f4efff;--card:#2a2450;--bd:#463d80;--g:linear-gradient(180deg,#2b2160,#1b1736)}}
:root[data-theme="dark"]{--g:linear-gradient(180deg,#2b2160,#1b1736);--bg:#1b1736;--fg:#f4efff;--card:#2a2450;--bd:#463d80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:var(--g);background-attachment:fixed;min-height:100vh;color:var(--fg);font:600 17px/1.3 "Fredoka","Nunito",system-ui,sans-serif}
#app{max-width:560px;margin:auto;padding:14px 14px 40px}
h1{margin:6px 0 0;font-size:28px}.sub{margin:2px 0 12px;opacity:.75;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chips button{border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:8px 14px;font:inherit;white-space:nowrap}
.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);color:var(--fg);border:3px solid var(--bd);border-radius:20px;padding:10px;font:inherit;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
.card .th svg{height:130px;width:auto;display:block}
.card small{opacity:.7}.card span{color:#f59e0b;letter-spacing:2px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bar b{flex:1;font-size:20px}
.bk{width:46px;height:46px;border-radius:14px;border:0;background:var(--ac);color:#fff;font-size:18px}
.ins{margin:4px 0 12px;text-align:center;font-size:18px}
#st{background:var(--card);border:3px solid var(--bd);border-radius:28px;padding:18px 14px;text-align:center;min-height:55vh;display:flex;flex-direction:column;justify-content:center}
.sk{animation:sk .4s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dot{display:inline-block;border-radius:50%}.leg{display:flex;justify-content:space-around;margin-bottom:10px;font-size:24px}
.leg div{display:flex;align-items:center;gap:6px}.big{margin:14px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px;margin-top:10px}
.ob{min-height:72px;border-radius:18px;border:3px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:30px;display:flex;align-items:center;justify-content:center;gap:6px}
.ob small{font-size:13px}
.go,.go2{border:0;border-radius:16px;padding:14px 22px;font:inherit;font-size:18px;background:#22c55e;color:#fff;margin-top:12px}.go2{background:#ef4444}
.row{display:flex;gap:10px;justify-content:center}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:120px}.g3 i{aspect-ratio:1;border:2px solid var(--fg);border-radius:6px;display:block}
.two{display:flex;align-items:center;justify-content:space-around;margin-bottom:12px;font-size:28px}
.pal{display:flex;gap:8px;justify-content:center}.pc{width:48px;height:48px;border-radius:50%;border:3px solid var(--bd);color:var(--fg);background:var(--card);font-size:20px}.pc.on{border-color:var(--fg);transform:scale(1.15)}
.g43{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.g43 i{aspect-ratio:1;background:#bbf7d0;border-radius:10px;font-style:normal;font-size:30px;display:flex;align-items:center;justify-content:center}
.cmd{margin:10px 0;font-size:26px;min-height:34px;letter-spacing:3px}
.slots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}.slots div{width:56px;height:64px;border:3px dashed var(--bd);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px}.slots small{font-size:11px}
#fl{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);background:var(--ac);color:#fff;padding:14px 22px;border-radius:20px;font-size:22px;transition:.2s;pointer-events:none}#fl.show{transform:translate(-50%,-50%) scale(1)}
.lv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--fg);border:3px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:8px;font:inherit;font-size:18px}.lv small{opacity:.7;font-size:14px;margin-left:auto;text-align:right}.ob small{font-size:12px}.ob{min-height:92px;font-size:38px}.ins{font-size:22px}.card .th svg{height:160px}.card{border-radius:26px;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .15s}.card:active,.go:active,.ob:active{transform:scale(.94)}#st{align-items:center}#st>*{max-width:100%}#st>.opts,#st>.g43,#st>.leg,#st>.two,#st>.slots{width:100%}.mas{display:flex;align-items:center;gap:10px;margin-bottom:6px}.mas span{font-size:64px;animation:bn 2s infinite}@keyframes bn{50%{transform:translateY(-8px)}}.bub{background:var(--card);border:3px solid var(--bd);border-radius:20px;padding:10px 14px;font-size:18px}.cf{position:fixed;top:-30px;font-size:28px;font-style:normal;animation:fall 1.5s ease-in forwards;pointer-events:none;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}#mu{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:8;width:48px;height:48px;border-radius:50%;border:3px solid var(--bd);background:var(--card);font-size:22px}@media(min-width:600px){#st{zoom:1.35}#app{max-width:900px}}.how{text-align:left;font-size:18px;line-height:1.7;background:var(--card);border:3px solid var(--bd);border-radius:18px;padding:12px 12px 12px 38px;margin:0 0 10px}h2{margin:14px 0 6px}.g33{display:grid;grid-template-columns:repeat(3,70px);gap:12px;justify-content:center;margin:10px 0}.g33 .pc{width:70px;height:70px;font-size:26px}.rd i{border-radius:50%}.fin{text-align:center;padding:20px 0}.fin .s{font-size:56px;color:#f59e0b}
.card .th img{width:100%;max-width:170px;height:auto;aspect-ratio:1;object-fit:contain;display:block;border-radius:14px}
</style></head><body><div id="app"></div><div id="fl"></div>
<script>
const $=s=>document.querySelector(s),R=a=>a[Math.random()*a.length|0],SH=a=>[...a].sort(()=>Math.random()-.5);

{id:'beda',t:'Cari yang Beda',a:[2,3],n:5,i:'Ketuk monster yang warnanya berbeda (cari bug-nya!)',

{id:'lampu',t:'Kode Lampu',a:[3,4],n:5,i:'Lihat saklarnya. Lampu menyala atau mati?',
 th:ph(c(50,45,18,'#facc15')+`<rect x="44" y="64" width="12" height="8" fill="#999"/><rect x="40" y="84" width="20" height="26" rx="3" fill="#22c55e"/>`),
 r(el,ans){const on=Math.random()<.5;
  el.innerHTML=`<svg width="90" viewBox="0 0 40 56"><rect x="4" y="2" width="32" height="52" rx="5" fill="#cbd5e1"/><rect x="12" y="${on?8:28}" width="16" height="20" rx="3" fill="${on?'#22c55e':'#ef4444'}"/></svg><div style="font-size:26px;margin:6px">${on?'↑ ON':'↓ OFF'}</div><div class="opts" style="grid-template-columns:1fr 1fr"><button class="ob" data-v="1">${bulb(1,50)}<small>NYALA</small></button><button class="ob" data-v="0">${bulb(0,50)}<small>MATI</small></button></div>`;
  el.querySelectorAll('.ob').forEach(b=>b.onclick=()=>ans((b.dataset.v==1)==on))}},
{id:'pola',t:'Pola Warna',a:[3,5],n:5,i:'Apa bentuk berikutnya? Lanjutkan polanya!',

  el.querySelectorAll('.ob').forEach(b=>b.onclick=()=>ans(k(op[b.dataset.j])==k(a)))}},
{id:'panah',t:'Panah Warna',a:[4,5],n:5,i:'Ikuti kode warna, pilih panah yang benar!',
 th:ph(c(34,34,8,'#ef4444')+c(50,34,8,'#facc15')+c(66,34,8,'#22c55e')+t(34,62,16,'↓')+t(50,62,16,'→')+t(66,62,16,'↑')+bar),
 r(el,ans){const L={m:['#ef4444','↓'],k:['#facc15','→'],h:['#22c55e','↑']},k=R(Object.keys(L));
  el.innerHTML=`<div class="leg">${Object.values(L).map(v=>`<div>${dot(v[0],30)}<b>${v[1]}</b></div>`).join('')}</div><div class="big">${dot(L[k][0],110)}</div><div class="opts">${SH(['↑','→','↓','←']).map(a=>`<button class="ob" data-a="${a}">${a}</button>`).join('')}</div>`;

   el.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{if(b.dataset.k==n){n++;n==N?ans(true):d()}else ans(false)})};d()}},
{id:'salin',t:'Salin Gambar',a:[5,6],n:3,i:'Warnai kotak kanan agar sama dengan kotak kiri!',
 th:ph(gr(22,40,['#ef4444','','','','#3b82f6','','','','#facc15'])+t(50,72,10,'➜')+gr(52,40,['#ef4444','','','','','','','',''])+bar),
 r(el,ans,i,lv){const P=['#ef4444','#facc15','#3b82f6','#22c55e'].slice(0,lv+1),T=Array(9).fill('');SH([...Array(9).keys()]).slice(0,2+lv+i).forEach(k=>T[k]=R(P));let U=Array(9).fill(''),cur=P[0];

  const d=()=>{el.innerHTML=`<div class="two">${g(T)}<b>➜</b>${g(U,1)}</div><div class="pal">${P.map(p=>`<button class="pc ${p==cur?'on':''}" style="background:${p}" data-c="${p}"></button>`).join('')}<button class="pc ${cur==''?'on':''}" data-c="">⌫</button></div><button class="go" id="ck">Periksa ✔</button>`;
   el.querySelectorAll('[data-k]').forEach(n=>n.onclick=()=>{U[n.dataset.k]=cur;d()});
   el.querySelectorAll('.pc').forEach(n=>n.onclick=()=>{cur=n.dataset.c;d()});
   $('#ck').onclick=()=>ans(T.join()==U.join())};d()}},
{id:'jalan',t:'Bantu Sapi Pulang',a:[5,6],n:5,i:'Susun kode panah agar sapi sampai ke kandang, lalu tekan Jalan!',
 th:ph(t(34,46,16,'🐄')+t(66,92,16,'🏠')+t(52,64,14,'🪨')+'<polyline points="34,54 34,78 66,78 66,86" fill="none" stroke="#a16207" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>'),
 r(el,ans,i,lv){const L0=[{b:[3,0],k:[]},{b:[2,1],k:[]},{b:[3,2],k:[[1,0],[1,1]]},{b:[3,2],k:[[2,0],[2,1]]},{b:[0,2],k:[[0,1]]}][i],L={b:L0.b,k:lv==1?[]:lv==2?L0.k:[...L0.k,[3,1]]},D={'→':[1,0],'←':[-1,0],'↑':[0,-1],'↓':[0,1]};let cm=[],p=[0,0],busy=0;
  const rk=(x,y)=>L.k.some(q=>q[0]==x&&q[1]==y);
  const d=()=>{let h='';for(let y=0;y<3;y++)for(let x=0;x<4;x++)h+=`<i>${p[0]==x&&p[1]==y?'🐄':L.b[0]==x&&L.b[1]==y?'🏠':rk(x,y)?'🪨':''}</i>`;
   el.innerHTML=`<div class="g43">${h}</div><div class="cmd">${cm.join(' ')||'<small>Tekan panah untuk menyusun kode</small>'}</div><div class="opts" style="grid-template-columns:repeat(4,1fr)">${Object.keys(D).map(a=>`<button class="ob" data-a="${a}">${a}</button>`).join('')}</div><div class="row"><button class="go2" id="cl">Hapus</button><button class="go" id="rn">Jalan ▶</button></div>`;
   el.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{if(!busy&&cm.length<10){cm.push(b.dataset.a);d()}});

{id:'sandi',t:'Pola Sandi',a:[5,6],n:3,
