/* ===== Kode Jalan Sapi: susun perintah panah, lalu tekan "Jalankan" =====

   (id 'labirin'). Di sini mekanik perintah dihidupkan lagi sebagai game terpisah dan diperbaiki:
   kegagalan memberi umpan balik, tidak bisa dijalankan dua kali bersamaan, dan sukses hanya
   jika sapi benar-benar tiba di kandang. */
H.jalan=['Lihat sapi 🐄 dan kandang 🏠 di kebun.','Ketuk panah untuk menyusun perintah, satu per satu.','Tekan Jalankan. Sapi akan berjalan mengikuti perintahmu.','Awas batu 🪨 dan pagar kebun! Kalau gagal, ubah perintahnya lalu coba lagi.'];

G.push({id:'jalan',t:'Kode Jalan Sapi',a:[5,6],n:5,img:1,i:'Susun kode panah agar sapi sampai ke kandang, lalu tekan Jalankan!',
 th:ph(t(34,46,16,'🐄')+t(66,92,16,'🏠')+t(52,64,14,'🪨')+'<polyline points="34,54 34,78 66,78 66,86" fill="none" stroke="#a16207" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>'),
 r(el,ans,i,lv){
  const L0=[{b:[3,0],k:[]},{b:[2,1],k:[]},{b:[3,2],k:[[1,0],[1,1]]},{b:[3,2],k:[[2,0],[2,1]]},{b:[0,2],k:[[0,1]]}][i%5],
   W=4,Hh=3,MAX=10,L={b:L0.b,k:lv==1?[]:lv==2?L0.k:[...L0.k,[3,1]]},
   D={'→':[1,0],'←':[-1,0],'↑':[0,-1],'↓':[0,1]},rk=(x,y)=>L.k.some(q=>q[0]==x&&q[1]==y),gen={};
  let cm=[],p=[0,0],cur=-1,busy=0;el.__jg=gen;
  const live=()=>el.isConnected&&el.__jg===gen;
  const d=()=>{let h='';for(let y=0;y<Hh;y++)for(let x=0;x<W;x++)h+=`<i>${p[0]==x&&p[1]==y?'🐄':L.b[0]==x&&L.b[1]==y?'🏠':rk(x,y)?'🪨':''}</i>`;
   el.innerHTML=`<div class="g43">${h}</div><div class="cmd">${cm.length?cm.map((a,j)=>j==cur?`<u>${a}</u>`:a).join(' '):'<small>Tekan panah untuk menyusun perintah</small>'}</div><div class="opts" style="grid-template-columns:repeat(4,1fr)">${Object.keys(D).map(a=>`<button class="ob" data-a="${a}">${a}</button>`).join('')}</div><div class="row" style="flex-wrap:wrap"><button class="go2" id="cl">🗑 Hapus</button><button class="go2" id="rs" style="background:#f59e0b">↺ Ulang</button><button class="go" id="rn">Jalankan ▶</button></div>`;
   el.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{if(busy)return;if(cm.length>=MAX){flash('Perintahnya sudah penuh!');return}cm.push(b.dataset.a);beep(440,.05);d()});
   el.querySelector('#cl').onclick=()=>{if(busy)return;cm=[];p=[0,0];cur=-1;d()};

   el.querySelector('#rn').onclick=jalankan};
  const jalankan=async()=>{if(busy||!cm.length)return;busy=1;p=[0,0];cur=-1;d();let why='short';
   for(let j=0;j<cm.length;j++){cur=j;d();await sleep(420);if(!live())return;

/* ===== Sistem skor terpusat + penyimpanan progres (localStorage: mpgames.progress.v1) ===== */
const SCORE=(()=>{
 const KEY='mpgames.progress.v1',P1=10,P2=5,PL=20,LVS=['1','2','3'];
 let st={v:1,games:Object.create(null)},ok=true;const RUNS=new Map();
 const n0=(x,m=1e9)=>typeof x=='number'&&isFinite(x)&&x>0?Math.min(Math.floor(x),m):0;
 const clean=raw=>{if(!raw||typeof raw!='object'||raw.v!==1||!raw.games||typeof raw.games!='object')return null;
  const o={v:1,games:Object.create(null)};
  for(const id of Object.keys(raw.games)){const g=raw.games[id];if(!/^[a-z0-9][a-z0-9_-]{0,23}$/i.test(id)||!g||typeof g!='object')continue;
   const e={score:n0(g.score),best:n0(g.best),plays:n0(g.plays),levels:{}};
   if(g.levels&&typeof g.levels=='object')for(const l of LVS){const v=g.levels[l];if(v&&typeof v=='object')e.levels[l]={done:n0(v.done,1e6),stars:n0(v.stars,3),best:n0(v.best)}}
   o.games[id]=e}
  return o};
 const load=()=>{let s=null;try{s=localStorage.getItem(KEY)}catch(e){ok=false;return}
  if(s==null)return;let p=null;try{p=clean(JSON.parse(s))}catch(e){p=null}
  if(p)st=p;else{try{localStorage.setItem(KEY+'.backup',s)}catch(e){}}};
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));ok=true}catch(e){ok=false}};
 const gp=id=>st.games[id]||(st.games[id]={score:0,best:0,plays:0,levels:{}});
 const run=rid=>{let r=RUNS.get(rid);if(!r){r={q:{},ok:0,pts:0,claimed:0};RUNS.set(rid,r);if(RUNS.size>30)RUNS.delete(RUNS.keys().next().value)}return r};
 /* questionId harus unik per soal per permainan: "<runId>:<nomor soal>" */
 const recordAnswer=(gameId,questionId,isCorrect)=>{if(!GCAT[gameId]||!questionId)return 0;
  const qk=String(questionId),r=run(qk.replace(/:[^:]*$/,'')),q=r.q[qk]||(r.q[qk]={w:0,d:0});
  if(q.d)return 0;if(!isCorrect){q.w++;return 0}
  q.d=1;const p=q.w?P2:P1;r.ok++;r.pts+=p;gp(gameId).score+=p;save();return p};
 const completeLevel=(gameId,levelId,o)=>{o=o||{};const lk=String(levelId),r=RUNS.get(o.runId);
  if(!GCAT[gameId]||!LVS.includes(lk)||!r||r.claimed)return 0;if(o.total&&r.ok<o.total)return 0;
  r.claimed=1;r.pts+=PL;const g=gp(gameId);g.score+=PL;g.plays++;g.best=Math.max(g.best,r.pts);
  const L=g.levels[lk]||(g.levels[lk]={done:0,stars:0,best:0});L.done++;L.stars=Math.max(L.stars,n0(o.stars,3));L.best=Math.max(L.best,r.pts);save();return PL};
 const getCategoryScore=cid=>((catOf(cid)||{g:[]}).g).reduce((a,id)=>a+(st.games[id]?st.games[id].score:0),0);
 const getTotalScore=()=>CATS.reduce((a,ct)=>a+getCategoryScore(ct.id),0);
 const getGameProgress=id=>JSON.parse(JSON.stringify(st.games[id]||{score:0,best:0,plays:0,levels:{}}));
 const levelStars=(id,l)=>{const g=st.games[id],v=g&&g.levels[String(l)];return v&&v.done>0?v.stars:0};
 const levelDone=(id,l)=>{const g=st.games[id],v=g&&g.levels[String(l)];return !!(v&&v.done>0)};
 const catStats=cid=>{const ct=catOf(cid);let levels=0,stars=0,three=0;ct.g.forEach(id=>LVS.forEach(l=>{if(levelDone(id,l)){levels++;stars+=levelStars(id,l);if(levelStars(id,l)==3)three++}}));
  return{levels,maxLevels:ct.g.length*3,stars,maxStars:ct.g.length*9,three,score:getCategoryScore(cid)}};
 const summary=()=>{const s={levels:0,stars:0,three:0,catsPlayed:0,maxLevels:0,maxStars:0,total:getTotalScore()};
  CATS.forEach(ct=>{const c=catStats(ct.id);s.levels+=c.levels;s.stars+=c.stars;s.three+=c.three;s.maxLevels+=c.maxLevels;s.maxStars+=c.maxStars;if(c.levels)s.catsPlayed++});return s};
 const resetProgress=()=>{st={v:1,games:Object.create(null)};RUNS.clear();try{localStorage.removeItem(KEY);ok=true}catch(e){ok=false}};
 const runPoints=rid=>(RUNS.get(rid)||{pts:0}).pts;
 load();
 return{recordAnswer,completeLevel,getTotalScore,getCategoryScore,getGameProgress,resetProgress,levelStars,catStats,summary,runPoints,storageOk:()=>ok,KEY};
})();

/* ======================================================================
   GAME 1 — METAMORFOSIS: mengurutkan tahap daur hidup (drag-and-drop / ketuk-lalu-ketuk).
   Validasi: urutan biologis. Kartu diacak tiap ronde.
   ====================================================================== */
function metaGame(el,ans,i,lv){
 const live=genTok(el),key=['kupu','katak'][(i+(lv==2?1:0))%2],M=META[key],T=M.tahap,N=T.length;
 let order=SH(T.map((_,k)=>k));for(let z=0;z<20&&order.every((v,k)=>v===k);z++)order=SH(order);
 const slots=Array(N).fill(-1);
 let sel=-1,done=0,busy=0,mark=null,fbk='',fbc='',suppress=0,nxt=0,wrong=0;
 const lab=placed=>lv==1||(lv==2&&placed);
 const card=(c,placed)=>`<button type="button" class="m6-cd${sel===c?' sel':''}" data-c="${c}" aria-label="Kartu ${esc(T[c].n)}">${T[c].svg()}${lab(placed)?`<small>${esc(T[c].s)}</small>`:''}</button>`;
 const render=()=>{
  const rest=order.filter(c=>!slots.includes(c)),full=slots.every(v=>v>=0);
  el.innerHTML=`<p class="m6-q">Susun daur hidup <b>${M.nama}</b> ${M.ic}<br><small>Seret kartu ke kotak, atau ketuk kartu lalu ketuk kotaknya.</small></p>
  <div class="m6-slots" role="list" aria-label="Urutan tahap">${slots.map((c,p)=>`<div class="m6-slot-w" role="listitem"><span class="no">${p+1}</span>${c>=0?`<div class="m6-slot has${mark?(mark[p]?' bad':' ok'):''}" data-p="${p}">${card(c,1)}</div>`:`<button type="button" class="m6-slot" data-p="${p}" aria-label="Kotak ${p+1}, kosong"><span class="m6-ph">${p+1}</span></button>`}</div>`).join('')}</div>
  <div class="m6-tray" ${rest.length?'':'data-empty="1"'} aria-label="Kartu yang belum dipasang">${rest.map(c=>card(c,0)).join('')}</div>
  <div class="m6-fb ${fbc}" role="status" aria-live="polite">${fbk||'Mulai dari tahap pertama ya!'}</div>
  <div class="m6-row"><button class="go2" type="button" data-x="clr"${busy?' disabled':''}>↺ Ulangi</button><button class="go" type="button" data-x="chk"${full&&!busy?'':' disabled'}>Periksa ✔</button></div>`;
 };
 const drop=(c,from,p)=>{const prev=slots[p];if(prev===c)return;if(from>=0)slots[from]=prev;slots[p]=c};
 const reset=()=>{sel=-1;mark=null;fbk='';fbc=''};
 const check=()=>{
  if(done||busy||slots.some(v=>v<0))return;
  const bad=slots.map((v,p)=>v!==p);
  if(!bad.some(Boolean)){win();return}
  wrong++;busy=1;mark=bad;const p=bad.indexOf(true),n=bad.filter(Boolean).length;
  const hint=p==0?'Daur hidup selalu dimulai dari telur.':`Coba ingat: apa yang terjadi setelah ${T[p-1].n.toLowerCase()}?`;
  fbk=(n==N?'Belum ada yang pas. ':`Ada ${n} kartu yang belum pas. Yang hijau sudah benar! `)+hint;fbc='bad';render();
  ans(false,'Belum tepat');say(fbk);
  setTimeout(()=>{if(!live())return;bad.forEach((b,q)=>{if(b)slots[q]=-1});mark=null;busy=0;fbk='Kartu yang belum pas sudah kembali. Coba lagi ya!';fbc='';render()},1800);
 };
 const win=()=>{done=1;sfx(1);burst();say('Betul! Urutan daur hidup '+M.nama.toLowerCase()+': '+T.map(x=>x.n.toLowerCase()).join(', lalu ')+'.');result()};
 const result=()=>{
  el.onpointerdown=null;
  el.innerHTML=`<div class="m6-fb good" role="status">🎉 Betul! Inilah daur hidup ${M.nama}.</div>
  <div class="m6-anim"><div class="m6-big" data-big></div><b class="m6-cap" data-cap></b><p class="m6-dsc" data-dsc></p></div>
  <div class="m6-strip" aria-hidden="true">${T.map((s,k)=>`<div class="m6-sm" data-k="${k}">${s.svg()}<span>${k+1}</span></div>${k<N-1?'<span class="ar">➜</span>':''}`).join('')}</div>
  <div class="m6-row"><button class="go2" type="button" data-x="rep">🔁 Putar lagi</button><button class="go" type="button" data-x="nxt">Lanjut ▶</button></div>`;
  let run=0;
  const show=k=>{const b=el.querySelector('[data-big]');if(!b)return;b.innerHTML=T[k].svg();b.classList.remove('m6-in');void b.offsetWidth;b.classList.add('m6-in');
   el.querySelector('[data-cap]').textContent=`Tahap ${k+1}: ${T[k].n}`;el.querySelector('[data-dsc]').textContent=T[k].d;
   el.querySelectorAll('.m6-sm').forEach((n,q)=>n.classList.toggle('on',q===k))};
  const play=()=>{const my=++run;let k=0;const step=()=>{if(!live()||my!==run)return;show(k);if(k<N-1){k++;setTimeout(step,1900)}};step()};
  el.onclick=e=>{const x=e.target.closest('[data-x]');if(!x)return;
   if(x.dataset.x==='rep')play();
   else if(x.dataset.x==='nxt'&&!nxt){nxt=1;run++;ans(true)}};
  play();
 };
 el.onclick=e=>{
  if(suppress||done||busy)return;
  const x=e.target.closest('[data-x]');
  if(x){if(x.dataset.x==='clr'){slots.fill(-1);reset();render()}else if(x.dataset.x==='chk')check();return}
  const cd=e.target.closest('.m6-cd'),sl=e.target.closest('[data-p]');
  if(cd&&sl){const p=+sl.dataset.p,c=+cd.dataset.c;if(sel>=0&&sel!==c){const s=sel;slots[p]=s}else slots[p]=-1;reset();render();return}
  if(cd){const c=+cd.dataset.c;sel=sel===c?-1:c;mark=null;render();return}
  if(sl){const p=+sl.dataset.p;if(sel>=0){slots[p]=sel;reset();render()}else if(slots[p]>=0){slots[p]=-1;reset();render()}else flash('Pilih kartu dulu ya')}
 };
 /* seret & lepas: pointer events (jalan di layar sentuh maupun mouse); ketuk tetap jadi alternatif */
 el.onpointerdown=e=>{
  if(done||busy||e.button>0)return;const cd=e.target.closest('.m6-cd');if(!cd)return;
  const c=+cd.dataset.c,from=slots.indexOf(c),sx=e.clientX,sy=e.clientY,id=e.pointerId;let ghost=null;
  const off=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',end);removeEventListener('pointercancel',cancel)};
  const under=ev=>{const tg=document.elementFromPoint(ev.clientX,ev.clientY);return{sl:tg&&tg.closest('[data-p]'),tr:tg&&tg.closest('.m6-tray')}};
  const mv=ev=>{if(ev.pointerId!==id)return;
   if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>10){ghost=document.createElement('div');ghost.className='m6-ghost';ghost.innerHTML=T[c].svg();document.body.appendChild(ghost);cd.classList.add('drag')}
   if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';el.querySelectorAll('.over').forEach(n=>n.classList.remove('over'));const u=under(ev);if(u.sl&&el.contains(u.sl))u.sl.classList.add('over')}};
  const end=ev=>{if(ev.pointerId!==id)return;off();if(!ghost)return;ghost.remove();suppress=1;setTimeout(()=>{suppress=0},80);
   if(!live()||done||busy)return;const u=under(ev);
   if(u.sl&&el.contains(u.sl))drop(c,from,+u.sl.dataset.p);else if(from>=0&&u.tr&&el.contains(u.tr))slots[from]=-1;
   reset();render()};
  const cancel=ev=>{if(ev.pointerId!==id)return;off();if(ghost){ghost.remove();suppress=1;setTimeout(()=>{suppress=0},80);if(live())render()}};
  addEventListener('pointermove',mv);addEventListener('pointerup',end);addEventListener('pointercancel',cancel);
 };
 qtxt='Susun daur hidup '+M.nama.toLowerCase()+'. Mulai dari telur!';
 render();
}

/* ======================================================================
   GAME 2 — SUSUN ES KRIM: meracik pesanan pelanggan.
   Validasi: wadah, jumlah tiap rasa, topping wajib/boleh. Urutan memilih tidak dinilai.
   ====================================================================== */
const FLV=[{id:'stroberi',n:'Stroberi',c:'#fda4c8',d:'#ec4899'},{id:'cokelat',n:'Cokelat',c:'#8b5a3c',d:'#5c3a21'},{id:'vanila',n:'Vanila',c:'#fff3c4',d:'#e0b94a'},{id:'melon',n:'Melon',c:'#a7f3d0',d:'#10b981'},{id:'blueberi',n:'Blueberi',c:'#a5b4fc',d:'#6366f1'}];
const TOP=[{id:'ceri',n:'Ceri',e:'🍒'},{id:'sprinkles',n:'Sprinkles',e:'✨'},{id:'saus',n:'Saus cokelat',e:'🍫'},{id:'kacang',n:'Kacang',e:'🥜'},{id:'biskuit',n:'Biskuit',e:'🍪'}];
const WDH=[{id:'cone',n:'Cone'},{id:'mangkuk',n:'Mangkuk'}];
const fOf=id=>FLV.find(f=>f.id===id),tOf=id=>TOP.find(t=>t.id===id),wOf=id=>WDH.find(w=>w.id===id);
const icoW=id=>id==='cone'?'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="12" r="9" fill="#fda4c8" stroke="#ec4899" stroke-width="2"/><path d="M11 18 L29 18 L20 38z" fill="#e8b36a" stroke="#b5762c" stroke-width="2" stroke-linejoin="round"/></svg>':'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="15" r="9" fill="#fda4c8" stroke="#ec4899" stroke-width="2"/><path d="M4 18 Q20 28 36 18 Q34 36 20 38 Q6 36 4 18z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/></svg>';
const SPR=[[-14,-10,'#ef4444',20],[-4,-18,'#3b82f6',-30],[8,-12,'#facc15',60],[14,-4,'#22c55e',-10],[-10,0,'#a855f7',40],[2,-2,'#ec4899',-50],[-18,-2,'#f97316',10],[16,-16,'#06b6d4',-60]];
function iceSVG(st,pop){
 const n=st.scoops.length,cone=st.wadah==='cone',P=cone?[[100,116],[100,82],[100,48]]:[[100,112],[66,126],[134,126]],r=cone?36:32;let s='';
 if(!st.wadah)s+='<path d="M56 128 L144 128 L100 236z" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="7 7" stroke-linejoin="round"/><text x="100" y="170" font-size="40" text-anchor="middle" fill="#9ca3af">?</text>';
 if(cone)s+='<clipPath id="m6cn"><path d="M56 128 L144 128 L100 236z"/></clipPath><path d="M56 128 L144 128 L100 236z" fill="#e8b36a"/><g clip-path="url(#m6cn)" stroke="#b5762c" stroke-width="2.5" opacity=".75"><path d="M40 130 L130 240 M60 126 L150 236 M80 126 L170 236 M100 126 L190 236 M120 126 L210 236 M20 130 L110 240 M160 130 L70 240 M140 126 L50 236 M120 126 L30 236 M100 126 L10 236 M80 126 L-10 236"/></g><path d="M56 128 L144 128 L100 236z" fill="none" stroke="#b5762c" stroke-width="3" stroke-linejoin="round"/>';
 else if(st.wadah==='mangkuk')s+='<ellipse cx="100" cy="134" rx="76" ry="15" fill="#bae6fd" stroke="#38bdf8" stroke-width="3"/>';
 st.scoops.forEach((id,j)=>{const f=fOf(id),[x,y]=P[j];
  s+=`<g class="${pop&&j==n-1?'m6-pop':''}"><circle cx="${x}" cy="${y}" r="${r}" fill="${f.c}" stroke="${f.d}" stroke-width="3"/><path d="M${x-r*.55} ${y-r*.25} a${r*.7} ${r*.7} 0 0 1 ${r*.45} -${r*.45}" stroke="#fff" stroke-width="4" opacity=".6" fill="none" stroke-linecap="round"/><path d="M${x-r+3} ${y+r*.55} q${r*.3} 12 ${r*.6} 0 q${r*.3} 12 ${r*.6} 0 q${r*.3} 12 ${r*.6} 0" stroke="${f.d}" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/></g>`});
 if(st.wadah==='mangkuk')s+='<path d="M26 130 Q100 166 174 130 Q172 214 100 228 Q28 214 26 130z" fill="#e0f2fe" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/><path d="M40 160 Q100 186 160 160" stroke="#fff" stroke-width="4" fill="none" opacity=".7" stroke-linecap="round"/>';
 if(n){const [tx,ty]=P[n-1];
  if(st.tops.includes('saus'))s+=`<path d="M${tx-r+2} ${ty-4} A${r-2} ${r-2} 0 0 1 ${tx+r-2} ${ty-4} q-5 16 -11 4 q-5 18 -12 0 q-6 14 -13 2 q-6 12 -12 -2 q-5 10 -9 -4z" fill="#5b341f"/>`;
  if(st.tops.includes('sprinkles'))s+=SPR.map(([dx,dy,c,a])=>`<rect x="${tx+dx-5}" y="${ty+dy*1.2-r*.45-2}" width="10" height="4" rx="2" fill="${c}" transform="rotate(${a} ${tx+dx} ${ty+dy*1.2-r*.45})"/>`).join('');
  if(st.tops.includes('kacang'))s+=[[-12,-.7],[0,-.9],[12,-.7],[-6,-.45],[7,-.5]].map(([dx,m])=>`<ellipse cx="${tx+dx}" cy="${ty+r*m}" rx="5" ry="3.4" fill="#b7793e" stroke="#7a4a1d" stroke-width="1.5" transform="rotate(${dx*3} ${tx+dx} ${ty+r*m})"/>`).join('');
  if(st.tops.includes('biskuit'))s+=`<g transform="rotate(24 ${tx+r*.55} ${ty-r*.7})"><circle cx="${tx+r*.55}" cy="${ty-r*.7}" r="13" fill="#d9a460" stroke="#92602b" stroke-width="2.5"/><circle cx="${tx+r*.55-4}" cy="${ty-r*.7-3}" r="2" fill="#5b341f"/><circle cx="${tx+r*.55+4}" cy="${ty-r*.7+2}" r="2" fill="#5b341f"/><circle cx="${tx+r*.55+1}" cy="${ty-r*.7+6}" r="1.6" fill="#5b341f"/></g>`;
  if(st.tops.includes('ceri'))s+=`<path d="M${tx} ${ty-r-6} q4 -14 14 -18" stroke="#166534" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="${tx}" cy="${ty-r-2}" r="10" fill="#dc2626" stroke="#991b1b" stroke-width="2.5"/><circle cx="${tx-3}" cy="${ty-r-5}" r="2.6" fill="#fff" opacity=".7"/>`;

}
const esDesc=st=>st.wadah?`Es krim di ${wOf(st.wadah).n.toLowerCase()}${st.scoops.length?' dengan '+st.scoops.map(x=>fOf(x).n.toLowerCase()).join(', '):', belum ada scoop'}${st.tops.length?', topping '+st.tops.map(x=>tOf(x).n.toLowerCase()).join(', '):''}`:'Belum ada wadah';
const mkEsOrder=lv=>{
 const w=R(WDH).id,fl=SH(FLV),sc=lv<3?fl.slice(0,lv==1?1:2).map(f=>f.id):(Math.random()<.5?fl.slice(0,3).map(f=>f.id):[fl[0].id,fl[0].id,fl[1].id]);
 const tp=SH(TOP),nt=lv==3?2:1,req=tp.slice(0,nt).map(x=>x.id),opt=lv>=2?[tp[nt].id]:[];

};
const cekEs=(o,s)=>{
 const p=[],need={},have={};
 if(!s.wadah)p.push('Pilih wadahnya dulu: cone atau mangkuk.');
 else if(s.wadah!==o.w)p.push(`Wadahnya belum sesuai. Pesanan minta ${wOf(o.w).n.toLowerCase()}.`);
 o.sc.forEach(x=>need[x]=(need[x]||0)+1);s.scoops.forEach(x=>have[x]=(have[x]||0)+1);
 if(!s.scoops.length)p.push('Belum ada scoop es krimnya.');
 else{for(const id in need){const a=have[id]||0,b=need[id];if(a<b)p.push(`Rasa ${fOf(id).n.toLowerCase()} masih kurang: pesanan ${b} scoop, baru ${a}.`);else if(a>b)p.push(`Rasa ${fOf(id).n.toLowerCase()} kebanyakan: pesanan ${b} scoop, ada ${a}.`)}
  for(const id in have)if(!need[id])p.push(`Rasa ${fOf(id).n.toLowerCase()} tidak ada di pesanan.`)}
 o.req.forEach(t=>{if(!s.tops.includes(t))p.push(`Topping ${tOf(t).n.toLowerCase()} belum ada.`)});
 s.tops.forEach(t=>{if(!o.req.includes(t)&&!o.opt.includes(t))p.push(`Topping ${tOf(t).n.toLowerCase()} tidak dipesan.`)});
 return p;
};
function esGame(el,ans,i,lv){
 const live=genTok(el),o=mkEsOrder(lv),st={wadah:null,scoops:[],tops:[]},MAX=3;
 let done=0,nxt=0,fbk='',fbc='',pop=0;
 const cnt={};o.sc.forEach(x=>cnt[x]=(cnt[x]||0)+1);
 const ticket=`<div class="m6-tk" aria-label="Pesanan pelanggan"><div class="who" aria-hidden="true">🧒</div><div class="tkb"><b>Pesanan:</b>
  <div class="tr"><span class="k">Wadah</span><span class="m6-tag" data-id="${o.w}">${wOf(o.w).n}</span></div>
  <div class="tr"><span class="k">Rasa</span>${Object.entries(cnt).map(([id,n])=>`<span class="m6-tag" data-id="${id}"><i class="dot" style="background:${fOf(id).c}"></i>${n>1?n+'× ':''}${fOf(id).n}</span>`).join('')}</div>
  <div class="tr"><span class="k">Topping</span>${o.req.map(t=>`<span class="m6-tag" data-id="${t}">${tOf(t).e} ${tOf(t).n}</span>`).join('')}</div>
  ${o.opt.length?`<div class="tr"><span class="k">Boleh</span>${o.opt.map(t=>`<span class="m6-tag opt" data-id="${t}">${tOf(t).e} ${tOf(t).n}</span>`).join('')}<small>(tidak wajib)</small></div>`:''}</div>
  ${lv==1?`<div class="prev" aria-hidden="true">${iceSVG({wadah:o.w,scoops:o.sc,tops:o.req},0)}</div>`:''}</div>`;

const cekSw=(o,s)=>{

 if(!topOk)p.push('Sandwich belum ditutup dengan roti di paling atas.');

 if(mid.includes('roti')){p.push('Roti hanya untuk alas dan penutup. Jangan taruh roti di tengah.');mid=mid.filter(x=>x!=='roti')}
 let comp=1;
 o.mid.forEach(id=>{const c=mid.filter(x=>x===id).length;if(!c){p.push(`Belum ada ${swN(id)}.`);comp=0}else if(c>1){p.push(`${SWI[id].n} kebanyakan, cukup 1.`);comp=0}});

 const render=()=>{

 }
 s+=`<g class="m6-plant ${fx==='grow'?'m6-grow':fx==='shake'?'m6-shake':''}">${p}</g>`;
 if(fx==='water')s+='<text x="150" y="58" font-size="34">🚿</text>'+[96,108,120,132,144].map((x,j)=>`<path d="M${x} 80 c5 6 5 11 0 11 c-5 0 -5 -5 0 -11z" fill="#38bdf8" class="m6-wd" style="animation-delay:${j*.15}s"/>`).join('');
 if(fx==='time')s+='<text x="40" y="70" font-size="36" class="m6-shake">⏳</text>';
 return `<svg class="m6-scene" viewBox="0 0 240 220" role="img" aria-label="${esc(`Pot dengan tanah ${S.tanah}, di tempat ${S.cahaya}, kondisi tanaman: ${tahapName(S)}`)}">${s}</svg>`;
}
const needText=(n,S)=>({siram:'Tanahnya kering, jadi tanaman butuh air.',terang:'Tanaman ada di tempat gelap, jadi butuh cahaya.',tanam:'Potnya masih kosong, jadi butuh benih.',tunggu:S.tanah==='basah'?'Tanahnya sudah basah. Tanaman butuh waktu, bukan air lagi.':'Air dan cahaya sudah cukup. Tanaman tinggal diberi waktu untuk tumbuh.'}[n]);
const okText=(n,S)=>({siram:'Tanah jadi lembap dan daun segar lagi. Air dibutuhkan akar tanaman.',terang:'Sekarang tanaman kena cahaya. Cahaya membantu tanaman membuat makanannya.',tanam:'Benih sudah ditanam di dalam tanah.',tunggu:S.tanah==='basah'?'Tanah mengering sedikit dan tanaman segar lagi. Kebanyakan air itu tidak baik, jadi cukup ditunggu.':'Tanaman sudah punya air dan cahaya, jadi tinggal diberi waktu. Lihat, tanamannya tumbuh!'}[n]);
function tanamanGame(el,ans,i,lv){
 const live=genTok(el);
 if(i===0||PLAN.lv!==lv||!PLAN.list)PLAN={lv,list:pickPlan(lv)};
 const key=PLAN.list[i%PLAN.list.length],sc=SC[key];
 let S={tanah:sc.tanah,cahaya:sc.cahaya,tahap:sc.tahap,lemas:sc.lemas,needs:[...sc.needs],done:[]};
 let fx='',busy=0,done=0,nxt=0,fbk='',fbc='',tries=0;const notes=[];
 const pend=()=>S.needs.filter(n=>!S.done.includes(n));
 const avail=a=>pend().includes(a)&&(a!=='siram'||!S.needs.includes('tanam')||S.done.includes('tanam'));
 const nextNeed=()=>pend().find(avail)||pend()[0];
 const ACT=[['siram','💧','Siram'],['terang','☀️','Pindah ke tempat terang'],['tanam','🌰','Tanam benih'],['tunggu','⏳','Beri waktu tumbuh']];
 const wrongMsg=a=>{
  if(a==='siram')return S.tahap==='kosong'?'Belum ada benih yang bisa disiram. Tanam benih dulu ya.':S.tanah==='basah'?'Tanahnya sudah basah sekali. Kalau disiram lagi, akar kebanyakan air dan tanaman jadi lemas.':'Tanahnya masih lembap, airnya sudah cukup. Disiram lagi malah bikin tanah becek.';
  if(a==='terang')return 'Tempat ini sudah terang. Cahayanya sudah cukup untuk tanaman.';
  if(a==='tanam')return 'Di pot ini sudah ada benih atau tanaman. Tidak perlu menanam lagi.';
  return 'Kalau hanya menunggu, tanaman tetap kekurangan sesuatu. Ada perawatan yang harus dilakukan dulu.';
 };
 const render=()=>{
  const chips=lv<3?`<div class="m6-chips" aria-label="Hasil pengamatan"><span class="m6-chip">🟫 Tanah: ${S.tanah}</span><span class="m6-chip">${S.cahaya==='terang'?'☀️':'☁️'} Cahaya: ${S.cahaya}</span><span class="m6-chip">🌱 Tanaman: ${tahapName(S)}</span></div>`:'';
  el.innerHTML=`<p class="m6-q">Amati tanamannya. <small>Apa yang dibutuhkan?</small></p>${plantSVG(S,fx)}${chips}
  <div class="m6-fb ${fbc}" role="status" aria-live="polite">${fbk||'Lihat tanah, cahaya, dan tanamannya. Lalu pilih tindakan.'}</div>
  ${done?'<button class="go" type="button" data-x="nxt">Lanjut ▶</button>':`<div class="m6-acts">${ACT.map(([a,e,n])=>`<button type="button" class="m6-act" data-a="${a}"${busy?' disabled':''}><span class="e" aria-hidden="true">${e}</span><span>${n}</span></button>`).join('')}</div>`}`;
 };
 const complete=()=>{done=1;fbk='🌿 Hebat! Tanamanmu sehat. '+notes.join(' ');fbc='good';sfx(1);burst();say('Hebat! Tanamanmu sehat. '+notes.join(' '));render();setTimeout(()=>{if(live()&&fx){fx='';render()}},1600)};
 const bad=a=>{
  tries++;const snap=JSON.stringify(S),msg=wrongMsg(a);
  if(a==='siram'){S.tanah='basah';if(S.tahap!=='kosong'&&S.tahap!=='benih')S.lemas=1;fx='water'}
  else if(a==='tunggu'){if(S.tahap!=='kosong'&&S.tahap!=='benih')S.lemas=1;fx='time'}
  else fx='shake';
  busy=1;fbk=msg;fbc='bad';render();ans(false,'Belum tepat');say(msg);
  setTimeout(()=>{if(!live())return;S=JSON.parse(snap);fx='';busy=0;fbk=tries>=2?'Petunjuk: '+needText(nextNeed(),S):'Aku kembalikan tanamannya. Amati lagi, apa yang dia butuhkan?';fbc='';render()},2200);
 };
 const act=a=>{
  if(busy||done)return;
  if(!avail(a)){bad(a);return}
  const m=okText(a,S);
  if(a==='siram'){S.tanah='lembap';S.lemas=0;fx='water'}
  else if(a==='terang'){S.cahaya='terang';fx='sun'}
  else if(a==='tanam'){S.tahap='benih';fx='grow'}
  else{if(S.tanah==='basah')S.tanah='lembap';S.lemas=0;S.tahap=NEXTT[S.tahap];fx='grow'}
  S.done.push(a);notes.push(m);beep(560,.08);
  if(!pend().length){complete();return}
  fbk=m+' Tapi tanaman masih butuh sesuatu. '+needText(nextNeed(),S);fbc='';busy=1;render();say(m);
  setTimeout(()=>{if(!live())return;busy=0;fx='';render()},1300);
 };
 el.onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.x==='nxt'){if(!nxt){nxt=1;ans(true)}return}
  if(b.dataset.a)act(b.dataset.a);
 };
 qtxt='Amati tanamannya: tanah, cahaya, dan tanamannya. Lalu pilih tindakan yang tepat!';
 render();
}
