/* ===== Kode Jalan Sapi: susun perintah panah, lalu tekan "Jalankan" =====
   Versi grid + perintah dari "Bantu Sapi Pulang" lama sempat tertimpa oleh versi gambar-jari
   (id 'labirin'). Di sini mekanik perintah dihidupkan lagi sebagai game terpisah dan diperbaiki:
   kegagalan memberi umpan balik, tidak bisa dijalankan dua kali bersamaan, dan sukses hanya
   jika sapi benar-benar tiba di kandang. */
H.jalan=['Lihat sapi 🐄 dan kandang 🏠 di kebun.','Ketuk panah untuk menyusun perintah, satu per satu.','Tekan Jalankan. Sapi akan berjalan mengikuti perintahmu.','Awas batu 🪨 dan pagar kebun! Kalau gagal, ubah perintahnya lalu coba lagi.'];

G.push({id:'jalan',t:'Kode Jalan Sapi',a:[5,6],n:5,img:1,i:'Susun kode panah agar sapi sampai ke kandang, lalu tekan Jalankan!',
 th:ph(t(34,46,16,'🐄')+t(66,92,16,'🏠')+t(52,64,14,'🪨')+'<polyline points="34,54 34,78 66,78 66,86" fill="none" stroke="#a16207" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>'),
 r(el,ans,i,lv){
  const L0=[{b:[3,0],k:[]},{b:[2,1],k:[]},{b:[3,2],k:[[1,0],[1,1]]},{b:[3,2],k:[[2,0],[2,1]]},{b:[0,2],k:[[0,1]]}][i%5],
   W=4,Hh=3,MAX=10,L={b:L0.b,k:lv==1?[]:lv==2?L0.k:[...L0.k,[3,1]]},
   D={'→':[1,0],'←':[-1,0],'↑':[0,-1],'↓':[0,1]},rk=(x,y)=>L.k.some(q=>q[0]==x&&q[1]==y),gen={};
  let cm=[],p=[0,0],cur=-1,busy=0;el.__jg=gen;
  const live=()=>el.isConnected&&el.__jg===gen;
  const d=()=>{let h='';for(let y=0;y<Hh;y++)for(let x=0;x<W;x++)h+=`<i>${p[0]==x&&p[1]==y?'🐄':L.b[0]==x&&L.b[1]==y?'🏠':rk(x,y)?'🪨':''}</i>`;
   el.innerHTML=`<div class="g43">${h}</div><div class="cmd">${cm.length?cm.map((a,j)=>j==cur?`<u>${a}</u>`:a).join(' '):'<small>Tekan panah untuk menyusun perintah</small>'}</div><div class="opts" style="grid-template-columns:repeat(4,1fr)">${Object.keys(D).map(a=>`<button class="ob" data-a="${a}">${a}</button>`).join('')}</div><div class="row" style="flex-wrap:wrap"><button class="go2" id="cl">🗑 Hapus</button><button class="go2" id="rs" style="background:#f59e0b">↺ Ulang</button><button class="go" id="rn">Jalankan ▶</button></div>`;
   el.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{if(busy)return;if(cm.length>=MAX){flash('Perintahnya sudah penuh!');return}cm.push(b.dataset.a);beep(440,.05);d()});
   el.querySelector('#cl').onclick=()=>{if(busy)return;cm=[];p=[0,0];cur=-1;d()};
   el.querySelector('#rs').onclick=()=>{if(busy)return;p=[0,0];cur=-1;d()};
   el.querySelector('#rn').onclick=jalankan};
  const jalankan=async()=>{if(busy||!cm.length)return;busy=1;p=[0,0];cur=-1;d();let why='short';
   for(let j=0;j<cm.length;j++){cur=j;d();await sleep(420);if(!live())return;
    const a=cm[j],np=[p[0]+D[a][0],p[1]+D[a][1]];
    if(np[0]<0||np[0]>=W||np[1]<0||np[1]>=Hh){why='out';break}
    if(rk(np[0],np[1])){why='rock';break}
    p=np;beep(300+j*40,.07);
    if(p[0]==L.b[0]&&p[1]==L.b[1]){why='ok';break}}
   if(!live())return;cur=-1;d();
   if(why=='ok'){ans(true);return}
   const msg={out:'Ups, sapi keluar dari kebun! 🌾',rock:'Awas, ada batu! 🪨',short:'Sapi belum sampai kandang. Tambah perintahnya ya!'}[why];
   ans(false,msg);await sleep(700);if(!live())return;p=[0,0];busy=0;d()};
  qtxt='Susun perintah panah supaya sapi sampai ke kandang. Lalu tekan Jalankan!';d()}});

const mazeGame=(id,t,ch,goalName,pathName,hint)=>{
 H[id]=['Lihat '+ch+' dan '+goalName+' di gambar.','Letakkan jarimu di '+ch+', lalu seret pelan-pelan mengikuti '+pathName+'.','Kalau jarimu keluar jalan, garis berhenti. Kembali ke titik merah lalu lanjutkan!','Sampai di '+goalName+', kamu menang!'];
 LV[id]=['Ada titik-titik penunjuk jalan','Tanpa penunjuk, ikuti '+pathName,'Tanpa penunjuk, soal kedua gambarnya terbalik'];
 G.push({id,t,a:[5,6],n:2,img:1,i:'Seret jarimu dari '+ch+' mengikuti '+pathName+' sampai ke '+goalName+'!',
  th:`<img src="${MZD}${MZ2[id].img}" alt="" onerror="this.outerHTML='<div style=font-size:70px>${hint}</div>'">`,
  r(el,ans,i,lv){
   const D=MZ2[id],N=D.n,bits=atob(D.m);let M=new Uint8Array(N*N);
   for(let j=0;j<N*N;j++)M[j]=(bits.charCodeAt(j>>3)>>(7-(j&7)))&1;
   if(lv==1){const O=new Uint8Array(N*N);for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(M[r*N+c])for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const rr=r+a,cc=c+b;if(rr>=0&&rr<N&&cc>=0&&cc<N)O[rr*N+cc]=1}M=O}
   const fx=i==1?1:0,fy=i==1&&lv==3?1:0,tx=x=>fx?1000-x:x,ty=y=>fy?1000-y:y,S=D.S;
   const P=D.p.split(' ').map(q=>q.split(',').map(Number));
   const gd=lv==1?`<polyline points="${P.map(q=>tx(q[0])+','+ty(q[1])).join(' ')}" fill="none" stroke="#7c4dff" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 26" opacity=".8"/>`:'';
   el.innerHTML=`<div id="mz" style="position:relative;width:min(100%,520px);aspect-ratio:1;margin:auto;touch-action:none;border-radius:20px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.12)"><img src="${MZD}${D.img}" alt="" draggable="false" onerror="flash('Gambar ${D.img} tidak ditemukan',5000)" style="width:100%;height:100%;display:block;pointer-events:none;transform:scale(${fx?-1:1},${fy?-1:1})"><svg viewBox="0 0 1000 1000" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">${gd}<polyline id="tr" fill="none" stroke="#ec4899" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><circle id="hd" r="20" fill="#ec4899" stroke="#fff" stroke-width="5" style="display:none"/><circle id="rg" cx="${tx(S[0])}" cy="${ty(S[1])}" r="60" fill="none" stroke="#7c4dff" stroke-width="8"><animate attributeName="r" values="55;80;55" dur="1.3s" repeatCount="indefinite"/></circle></svg></div>`;
   qtxt='Seret jarimu dari '+ch+' mengikuti '+pathName+' sampai ke '+goalName+'!';
   const z=$('#mz'),tr=$('#tr'),rg=$('#rg'),hd=$('#hd');
   let pts=[],dr=0,fp=null,lv0=null,frozen=0,warnAt=0;
   const at=e=>{const b=z.getBoundingClientRect();return[(e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height]};
   const on=(nx,ny)=>{const c=Math.floor((fx?1-nx:nx)*N),r=Math.floor((fy?1-ny:ny)*N);return c>=0&&c<N&&r>=0&&r<N&&M[r*N+c]==1};
   const dist=(nx,ny,x,y)=>Math.hypot(nx*1000-tx(x),ny*1000-ty(y));
   const draw=()=>{tr.setAttribute('points',pts.map(p=>(p[0]*1000|0)+','+(p[1]*1000|0)).join(' '));
    if(lv0){hd.style.display='';hd.setAttribute('cx',lv0[0]*1000);hd.setAttribute('cy',lv0[1]*1000);hd.setAttribute('fill',frozen?'#ef4444':'#ec4899')}else hd.style.display='none'};
   const reset=()=>{dr=0;fp=null;lv0=null;frozen=0;pts=[];draw();rg.style.display=''};
   const win=(x,y)=>D.G.some(g=>dist(x,y,g[0],g[1])<D.gr);
   /* satu langkah kecil dari jari; false = permainan selesai */
   const step=(x,y)=>{
    if(on(x,y)){
     if(frozen){if(Math.hypot((x-lv0[0])*1000,(y-lv0[1])*1000)>34)return true;frozen=0}
     const q=pts[pts.length-1];if(!q||Math.hypot(x-q[0],y-q[1])>.006)pts.push([x,y]);lv0=[x,y];
     if(win(x,y)){dr=2;draw();ans(true);return false}
    }else if(!frozen){frozen=1;const n=Date.now();if(n-warnAt>2500){warnAt=n;flash('Keluar jalan! Kembali ke titik merah 🔴',1400)}}
    return true};
   z.onpointerdown=e=>{if(dr==2)return;e.preventDefault();const[x,y]=at(e);
    if(dist(x,y,S[0],S[1])>D.sr){flash('Mulai dari '+ch+' ya! ✋',1200);return}
    z.setPointerCapture(e.pointerId);dr=1;pts=[];frozen=0;lv0=null;fp=[x,y];rg.style.display='none';
    if(step(x,y))draw()};
   z.onpointermove=e=>{if(dr!=1)return;const[x,y]=at(e),n=Math.max(1,Math.ceil(Math.hypot(x-fp[0],y-fp[1])/.003));
    for(let j=1;j<=n;j++)if(!step(fp[0]+(x-fp[0])*j/n,fp[1]+(y-fp[1])*j/n)){draw();return}
    fp=[x,y];draw()};
   z.onpointerup=z.onpointercancel=()=>{if(dr==1)reset()};
  }});
};

/* ===== Sistem skor terpusat + penyimpanan progres (localStorage: mpgames.progress.v1) ===== */
const SCORE=(()=>{
 const KEY='mpgames.progress.v1',P1=10,P2=5,PL=20,LVS=['1','2','3'];
 let st={v:1,games:Object.create(null)},ok=true;const RUNS=new Map();
 const n0=(x,m=1e9)=>typeof x=='number'&&isFinite(x)&&x>0?Math.min(Math.floor(x),m):0;
 const clean=raw=>{if(!raw||typeof raw!='object'||raw.v!==1||!raw.games||typeof raw.games!='object')return null;
  const o={v:1,games:Object.create(null)};
  for(const id of Object.keys(raw.games)){const g=raw.games[id];if(!/^[a-z0-9][a-z0-9_-]{0,23}$/i.test(id)||!g||typeof g!='object')continue;
   const e={score:n0(g.score),best:n0(g.best),plays:n0(g.plays),levels:{}};
   if(g.levels&&typeof g.levels=='object')for(const l of LVS){const v=g.levels[l];if(v&&typeof v=='object')e.levels[l]={done:n0(v.done,1e6),stars:n0(v.stars,3),best:n0(v.best)}}
   o.games[id]=e}
  return o};
 const load=()=>{let s=null;try{s=localStorage.getItem(KEY)}catch(e){ok=false;return}
  if(s==null)return;let p=null;try{p=clean(JSON.parse(s))}catch(e){p=null}
  if(p)st=p;else{try{localStorage.setItem(KEY+'.backup',s)}catch(e){}}};
 const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));ok=true}catch(e){ok=false}};
 const gp=id=>st.games[id]||(st.games[id]={score:0,best:0,plays:0,levels:{}});
 const run=rid=>{let r=RUNS.get(rid);if(!r){r={q:{},ok:0,pts:0,claimed:0};RUNS.set(rid,r);if(RUNS.size>30)RUNS.delete(RUNS.keys().next().value)}return r};
 /* questionId harus unik per soal per permainan: "<runId>:<nomor soal>" */
 const recordAnswer=(gameId,questionId,isCorrect)=>{if(!GCAT[gameId]||!questionId)return 0;
  const qk=String(questionId),r=run(qk.replace(/:[^:]*$/,'')),q=r.q[qk]||(r.q[qk]={w:0,d:0});
  if(q.d)return 0;if(!isCorrect){q.w++;return 0}
  q.d=1;const p=q.w?P2:P1;r.ok++;r.pts+=p;gp(gameId).score+=p;save();return p};
 const completeLevel=(gameId,levelId,o)=>{o=o||{};const lk=String(levelId),r=RUNS.get(o.runId);
  if(!GCAT[gameId]||!LVS.includes(lk)||!r||r.claimed)return 0;if(o.total&&r.ok<o.total)return 0;
  r.claimed=1;r.pts+=PL;const g=gp(gameId);g.score+=PL;g.plays++;g.best=Math.max(g.best,r.pts);
  const L=g.levels[lk]||(g.levels[lk]={done:0,stars:0,best:0});L.done++;L.stars=Math.max(L.stars,n0(o.stars,3));L.best=Math.max(L.best,r.pts);save();return PL};
 const getCategoryScore=cid=>((catOf(cid)||{g:[]}).g).reduce((a,id)=>a+(st.games[id]?st.games[id].score:0),0);
 const getTotalScore=()=>CATS.reduce((a,ct)=>a+getCategoryScore(ct.id),0);
 const getGameProgress=id=>JSON.parse(JSON.stringify(st.games[id]||{score:0,best:0,plays:0,levels:{}}));
 const levelStars=(id,l)=>{const g=st.games[id],v=g&&g.levels[String(l)];return v&&v.done>0?v.stars:0};
 const levelDone=(id,l)=>{const g=st.games[id],v=g&&g.levels[String(l)];return !!(v&&v.done>0)};
 const catStats=cid=>{const ct=catOf(cid);let levels=0,stars=0,three=0;ct.g.forEach(id=>LVS.forEach(l=>{if(levelDone(id,l)){levels++;stars+=levelStars(id,l);if(levelStars(id,l)==3)three++}}));
  return{levels,maxLevels:ct.g.length*3,stars,maxStars:ct.g.length*9,three,score:getCategoryScore(cid)}};
 const summary=()=>{const s={levels:0,stars:0,three:0,catsPlayed:0,maxLevels:0,maxStars:0,total:getTotalScore()};
  CATS.forEach(ct=>{const c=catStats(ct.id);s.levels+=c.levels;s.stars+=c.stars;s.three+=c.three;s.maxLevels+=c.maxLevels;s.maxStars+=c.maxStars;if(c.levels)s.catsPlayed++});return s};
 const resetProgress=()=>{st={v:1,games:Object.create(null)};RUNS.clear();try{localStorage.removeItem(KEY);ok=true}catch(e){ok=false}};
 const runPoints=rid=>(RUNS.get(rid)||{pts:0}).pts;
 load();
 return{recordAnswer,completeLevel,getTotalScore,getCategoryScore,getGameProgress,resetProgress,levelStars,catStats,summary,runPoints,storageOk:()=>ok,KEY};
})();

['🌱','Langkah Pertama','Selesaikan 1 level',s=>s.levels>=1],
['🌟','Bintang Tiga','Dapat 3 bintang',s=>s.three>=1],
['🧭','Penjelajah','Main di 5 kategori',s=>s.catsPlayed>=CATS.length],
['🎯','10 Level','Selesaikan 10 level',s=>s.levels>=10],
['🏅','100 Poin','Kumpulkan 100 poin',s=>s.total>=100],
['🏆','500 Poin','Kumpulkan 500 poin',s=>s.total>=500]];

/* ===== Navigasi ===== */
let curRun=0,runSeq=0,curCat=null;
const AGE_F=[0,[2,3],[4,4],[5,6]],AGE_N=['Semua','2–3 th','4 th','5–6 th'];
const ageOk=(g,f)=>!AGE_F[f]||(g.a[0]<=AGE_F[f][1]&&g.a[1]>=AGE_F[f][0]);
const cardHtml=k=>{const g=G[k];return `<button class="card" data-g="${g.id}" style="border-color:hsl(${k*47} 85% 65%)" onclick="intro(${k})"><div class="th">${thumb(g,k)}</div><b>${g.t}</b><small>Usia ${g.a[0]==g.a[1]?g.a[0]:g.a.join('–')} th</small><span>${[1,2,3].map(l=>stars[g.id+l]?'★':'☆').join('')}</span></button>`};
const toTop=()=>{try{window.scrollTo(0,0)}catch(e){}};

const kikoHi=el=>{el.classList.remove('hi');void el.offsetWidth;el.classList.add('hi');say(R(['Halo! Aku Kiko. Ayo kita main coding bareng!','Miaw! Aku Kiko, temanmu bermain!','Ayo, pilih permainan favoritmu!']))};
function menu(){curRun=0;curCat=null;
 view(`<div class="mas"><img class="kiko" src="gambar%20mockup%20menu/maskot-kiko.webp" alt="Kiko si kucing" draggable="false" onclick="kikoHi(this)" onerror="this.outerHTML='<span style=font-size:64px>🐱</span>'"><div class="bub">Halo, aku Kiko! Yuk main coding bareng! 🎉<br><button class="bk" style="width:auto;padding:6px 12px;font-size:15px;margin-top:6px" onclick="nextVoice()">🗣️ Ganti suara</button> <button class="bk" style="width:auto;padding:6px 12px;font-size:15px;margin-top:6px" onclick="testVoice()">🔈 Tes suara</button></div></div><h1>🧩 MP Games</h1><p class="sub">Pilih permainan coding, ya!</p><button class="pill" id="skorBtn" onclick="skorPage()" style="margin-bottom:12px">⭐ <b>${SCORE.getTotalScore()}</b> poin · 🏆 Lihat skor</button><div class="grid">${CATS.map((ct,k)=>`<button class="card cat" data-cat="${ct.id}" style="border-color:${ct.c};${k==CATS.length-1&&CATS.length%2?'grid-column:1/-1;':''}" onclick="catPage('${ct.id}')"><div class="ic">${ct.ic}</div><b>${ct.t}</b><small>${ct.d}</small><small>${ct.g.length} game · ⭐ ${SCORE.getCategoryScore(ct.id)}</small></button>`).join('')}</div><p class="sub" style="text-align:center;margin-top:16px">Disarankan didampingi orang tua 👨‍👩‍👧 · v5</p>`);toTop()}

const setAge=k=>{filt=k;catPage(curCat)};
function catPage(id){const ct=catOf(id);if(!ct)return menu();curRun=0;curCat=id;
 const ks=ct.g.map(gid=>G.findIndex(g=>g.id==gid)).filter(k=>k>=0&&ageOk(G[k],filt));
 view(`<div class="bar"><button class="bk" onclick="menu()">◀</button><b>${ct.ic} ${ct.t}</b><span class="pill" style="padding:4px 12px;font-size:16px">⭐ ${SCORE.getCategoryScore(id)}</span></div><p class="sub">Pilih usia, lalu pilih game.</p><div class="chips">${AGE_N.map((n,k)=>`<button class="${k==filt?'on':''}" onclick="setAge(${k})">${n}</button>`).join('')}</div>${ks.length?`<div class="grid">${ks.map(cardHtml).join('')}</div>`:`<div class="empty">Belum ada game ${ct.t.replace('&amp;','&')} untuk usia ${AGE_N[filt]}.<br><button class="go" onclick="setAge(0)">Tampilkan semua usia</button></div>`}`);toTop()}

function skorPage(){curRun=0;const S=SCORE.summary();
 const rows=CATS.map(ct=>{const c=SCORE.catStats(ct.id);return `<div class="sc-row"><span style="font-size:30px">${ct.ic}</span><div><b>${ct.t}</b><br><small>${c.levels}/${c.maxLevels} level · ★ ${c.stars}/${c.maxStars}</small></div><span class="n">${c.score}</span></div>`}).join('');
 const bd=BADGES.map(b=>`<div class="bd ${b[3](S)?'':'off'}"><div style="font-size:34px">${b[0]}</div><b>${b[1]}</b><small>${b[2]}</small></div>`).join('');
 const rec=[];CATS.forEach(ct=>ct.g.forEach(id=>{const p=SCORE.getGameProgress(id);if(p.plays>0){const gg=gi(id),bs=Math.max(0,...[1,2,3].map(l=>SCORE.levelStars(id,l)));rec.push(`<div class="sc-row"><div><b>${gg.t}</b><br><small>${'★'.repeat(bs)+'☆'.repeat(3-bs)} · ${p.plays}× selesai</small></div><span class="n">🏆 ${p.best}</span></div>`)}}));
 view(`<div class="bar"><button class="bk" onclick="menu()">◀</button><b>🏆 Skor Kamu</b></div><div class="fin" style="padding:6px 0"><div class="s">⭐</div><h1 style="margin:0" id="totSkor">${S.total} poin</h1><p class="sub">${S.levels} level selesai · ${S.stars} bintang</p></div><h2>Skor per kategori</h2>${rows}<h2>🎖️ Pencapaian</h2><div class="badges">${bd}</div><h2>🥇 Rekor terbaik</h2>${rec.length?rec.join(''):'<p class="sub">Belum ada rekor. Ayo main dulu!</p>'}<p class="sub" style="text-align:center;margin-top:16px">Skor disimpan di perangkat ini saja, tidak ikut pindah ke HP atau komputer lain.</p>${SCORE.storageOk()?'':'<p class="sub" style="text-align:center;color:#ef4444">Perangkat ini tidak mengizinkan penyimpanan, jadi skor akan hilang saat halaman ditutup.</p>'}<button class="go2" id="resetBtn" style="width:100%" onclick="askReset()">Hapus semua skor</button>`);toTop()}

function askReset(){if($('#mdl'))return;const m=document.createElement('div');m.id='mdl';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
 m.innerHTML='<div><div style="font-size:48px">⚠️</div><h2 style="margin:6px 0">Hapus semua skor?</h2><p>Skor, bintang, dan rekor di perangkat ini akan dihapus. Ini tidak bisa dibatalkan.</p><div class="row" style="flex-wrap:wrap"><button class="go" id="rsN">Batal</button><button class="go2" id="rsY">Ya, hapus</button></div></div>';
 document.body.appendChild(m);$('#rsN').onclick=()=>m.remove();$('#rsY').onclick=()=>{m.remove();SCORE.resetProgress();syncStars();flash('Skor sudah dihapus');skorPage()};$('#rsN').focus()}

function intro(k,quiet){const g=G[k],cid=GCAT[g.id];curRun=0;curCat=cid;if(!quiet)setTimeout(()=>say('Cara bermain '+g.t+'. '+H[g.id].join('. ')),150);
 view(`<div class="bar"><button class="bk" onclick="catPage('${cid}')">◀</button><b>${g.t}</b></div><div class="card" style="width:60%;margin:auto"><div class="th">${thumb(g,k)}</div></div><h2>📖 Cara Bermain</h2><ol class="how">${H[g.id].map(x=>`<li>${x}</li>`).join('')}</ol><p class="sub" style="text-align:center">${g.n} soal • Usia ${g.a[0]==g.a[1]?g.a[0]:g.a.join('–')} tahun</p><h2>🎚️ Pilih Level</h2>${[1,2,3].map(l=>`<button class="lv" onclick="go(${k},${l})"><b>Level ${l}</b> ${stars[g.id+l]?'★':'☆'}<small>${LV[g.id][l-1]}</small></button>`).join('')}`);toTop()}

function run(k,lv=1){const g=G[k],tok=++runSeq,rid=g.id+'.L'+lv+'.'+tok;curRun=tok;curCat=GCAT[g.id];let i=0,sc=0,mis=0,locked=0,qid='';
 view(`<div class="bar"><button class="bk" onclick="intro(${k},1)">◀</button><b>${g.t} · Lv ${lv}</b><span id="pg"></span><button class="bk" style="background:#f59e0b" onclick="say(LQ)">🔊</button></div><p class="ins">${g.i}</p><div id="st"></div>`);
 /* ans: satu-satunya pintu skor. Diabaikan jika pemain sudah keluar dari permainan ini,
    atau jika soal sudah dijawab benar dan sedang menunggu pindah ke soal berikutnya. */
 const ans=(ok,why)=>{if(tok!==curRun||locked)return;
  if(ok){locked=1;const p=SCORE.recordAnswer(g.id,qid,true);if(!mis)sc++;const m=R(OKS);flash(m+' 🌟'+(p?' +'+p:''));sfx(1);burst();sayThen(m,()=>{if(tok!==curRun)return;i++;nx()})}
  else{mis++;SCORE.recordAnswer(g.id,qid,false);const m=why||R(NO);flash(m+' 💪');sfx(0);say(m);const s=$('#st');if(s){s.classList.add('sk');setTimeout(()=>s.classList.remove('sk'),400)}}};
 const nx=()=>{if(tok!==curRun)return;
  if(i>=g.n){const s=sc/g.n>=.8?3:sc/g.n>=.5?2:1,bonus=SCORE.completeLevel(g.id,lv,{runId:rid,total:g.n,stars:s}),rp=SCORE.runPoints(rid);stars[g.id+lv]=Math.max(stars[g.id+lv]||0,s);say('Kamu hebat! Kamu dapat '+s+' bintang!');
   view(`<div class="fin"><img class="kikof" src="gambar%20mockup%20menu/maskot-kiko.webp" alt="" onerror="this.remove()"><div class="s">${'★'.repeat(s)+'☆'.repeat(3-s)}</div><h1>Kamu hebat!</h1><p class="sub">${sc} dari ${g.n} benar di percobaan pertama</p><p class="sub" id="finPts">⭐ +${rp} poin${bonus?` (termasuk bonus level +${bonus})`:''} · Total ${SCORE.getTotalScore()}</p><button class="go" onclick="run(${k},${lv})">Main lagi</button> ${lv<3?`<button class="go" style="background:#f59e0b" onclick="run(${k},${lv+1})">Level ${lv+1} ▶</button>`:''} <button class="go2" style="background:var(--ac)" onclick="catPage('${GCAT[g.id]}')">Daftar Game</button> <button class="go2" style="background:#0ea5e9" onclick="skorPage()">🏆 Skor</button></div>`);return}
  mis=0;locked=0;qid=rid+':'+i;$('#pg').textContent=`${i+1}/${g.n}`;qtxt='';try{g.r($('#st'),ans,i,lv)}catch(e){$('#st').innerHTML='<p style="font-size:18px">⚠️ Error: '+e.message+'</p>'}const q=qtxt||(QS[g.id]?QS[g.id](lv):'');LQ=q||g.i;say(i==0?g.i+' '+q:LQ)};nx()}

syncStars();
menu();
</script></body></html>
